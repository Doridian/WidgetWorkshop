[package]
name = "widget"
version = "0.1.0"
description = "Widget Workshop, the Maxis toy, ported"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engine = { path = "../engine" }
formats = { path = "../formats" }
platform = { path = "../platform" }
web-time = "1.1"
# `wasmbind`: the browser's clock on wasm, where `std::time` panics.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

# The file dialog that asks for the CD when it isn't given (`pick`):
# natively only, the browser's page asks for it itself.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.18"

# Whether rfd has a dialog to show (`pick::has_dialog`): the portal's
# FileChooser on the session bus.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
zbus = { version = "6", default-features = false, features = ["default-rt"] }

# The browser build (docs/web.md): the page's storage and its query.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# The version of the wasm-bindgen CLI that builds the page
# (tools/build-web.sh): the two must match exactly.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "EventTarget", "Location", "Window"] }

# The Windows executable's icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
